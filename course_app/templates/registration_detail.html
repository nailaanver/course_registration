<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Detail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
        background: #eef2f7;
        font-family: "Segoe UI", sans-serif;
    }
    .detail-card {
        max-width: 650px;
        background: #ffffff;
        padding: 35px;
        margin: auto;
        margin-top: 60px;
        border-radius: 15px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.1);
    }
    .detail-title {
        font-weight: 700;
        color: #2c3e50;
    }
    .label {
        font-weight: 600;
        color: #34495e;
    }
    .value-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 10px 15px;
        border-radius: 8px;
        margin-bottom: 15px;
    }
    .btn-back {
        border-radius: 10px;
        padding: 10px 20px;
    }
  </style>
</head>
<body>

<div class="detail-card">
    <h2 class="detail-title text-center mb-4">Registration Details</h2>
    <hr>

    <div class="mb-3">
        <span class="label">ID:</span>
        <div class="value-box">{{ registration.id }}</div>
    </div>

    <div class="mb-3">
        <span class="label">Name:</span>
        <div class="value-box">{{ registration.student_name }}</div>
    </div>

    <!-- <div class="mb-3">
        <span class="label">Email:</span>
        <div class="value-box">{{ registration.user.email }}</div>
    </div> -->

    <div class="mb-3">
        <span class="label">Course:</span>
        <div class="value-box">{{ registration.course }}</div>
    </div>

    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-back w-100 mt-3">⬅ Back to Dashboard</a>
</div>

</body>
</html>
