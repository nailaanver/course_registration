{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ course.course_name }} | Course Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
        background: #f2f6fa;
    }
    .course-card {
        max-width: 700px;
        background: #ffffff;
        padding: 35px;
        margin: auto;
        margin-top: 60px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .course-title {
        font-weight: 700;
        color: #2d3e50;
        margin-bottom: 15px;
    }
    .course-label {
        font-weight: 600;
        color: #34495e;
    }
    hr {
        margin: 20px 0;
    }
    .btn-custom {
        border-radius: 10px;
        padding: 10px 20px;
    }
  </style>
</head>
<body>

<div class="course-card">

    <h2 class="course-title text-center">{{ course.course_name }}</h2>
    <hr>

    <p><span class="course-label">Duration:</span> {{ course.duration }}</p>

    <p class="course-label">Description:</p>
    <div class="p-3 rounded" style="background:#f8fafc; border:1px solid #e2e8f0;">
        {{ course.description }}
    </div>

    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-custom mt-4 w-100">
        ⬅ Back to Dashboard
    </a>
</div>

</body>
</html>
