{% extends 'master.html' %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #f0f4f8;
    }
    .register-card {
        max-width: 480px;
        background: #fff;
        border-radius: 15px;
        padding: 35px;
        margin: auto;
        margin-top: 50px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    }
    .register-title {
        font-weight: 700;
        color: #2c3e50;
    }
    .form-control {
        border-radius: 10px;
        padding: 10px 12px;
    }
    button {
        border-radius: 10px;
        padding: 10px;
    }
</style>

<div class="register-card">

    <h2 class="text-center register-title mb-4">Student Registration</h2>

    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary w-100 mt-3">Register</button>

        <p class="mt-3 text-center">
            Already have an account?
            <a href="{% url 'login' %}" class="fw-semibold">Login here</a>
        </p>
    </form>

</div>

{% endblock %}
